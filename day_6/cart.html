<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        #cart-container {
            display: grid;
            gap: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 10px;
        }

        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        .cart-item h2 {
            font-size: 18px;
            flex: 1;
        }

        button {
            padding: 8px 15px;
            margin: 3px;
            cursor: pointer;
        }

        #total {
            text-align: right;
            font-size: 24px;
            margin-top: 30px;
        }

        #empty-cart {
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>My Cart 🛒</h1>

    <div id="cart-container"></div>

    <h2 id="total">Total: $0</h2>

    <script src="./cart.js"></script>

</body>

</html>
